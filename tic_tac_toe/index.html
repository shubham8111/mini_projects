<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tic Tac Toe" />
  <meta name="description" content="Tic Tac Toe – Vanishing Marks Edition. Each player can have at most 4 marks; the oldest disappears when a 5th is placed." />

  <title>Tic Tac Toe — Vanishing Marks</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <h1>Tic Tac Toe</h1>
      <p>Vanishing Marks Edition</p>
    </header>

    <!-- Player cards -->
    <section class="players" aria-label="Players">

      <div class="player-card x-card active" aria-label="Player X">
        <div class="player-symbol">X</div>
        <div class="player-label">Player X</div>
        <div class="mark-pips" aria-label="X marks on board">
          <span class="pip" aria-hidden="true"></span>
          <span class="pip" aria-hidden="true"></span>
          <span class="pip" aria-hidden="true"></span>
        </div>
        <div class="turn-arrow">YOUR TURN</div>
      </div>

      <div class="player-card o-card" aria-label="Player O">
        <div class="player-symbol">O</div>
        <div class="player-label">Player O</div>
        <div class="mark-pips" aria-label="O marks on board">
          <span class="pip" aria-hidden="true"></span>
          <span class="pip" aria-hidden="true"></span>
          <span class="pip" aria-hidden="true"></span>
        </div>
        <div class="turn-arrow">YOUR TURN</div>
      </div>

    </section>

    <!-- Game board -->
    <main class="board-wrap" aria-label="Game board">
      <div id="board" class="board" role="grid" aria-label="Tic Tac Toe board">
        <div class="cell" role="gridcell" aria-label="Cell 1"  data-index="0"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 2"  data-index="1"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 3"  data-index="2"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 4"  data-index="3"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 5"  data-index="4"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 6"  data-index="5"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 7"  data-index="6"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 8"  data-index="7"><div class="mark"></div></div>
        <div class="cell" role="gridcell" aria-label="Cell 9"  data-index="8"><div class="mark"></div></div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p class="hint">
        <span class="warn-dot"></span>Pulsing mark disappears on next placement
      </p>
      <p class="move-counter">Move <span id="move-count">0</span></p>
      <button class="btn-new-game" id="btn-new-game" aria-label="Start new game">New Game</button>
    </footer>

  </div>

  <!-- Win overlay -->
  <div id="win-overlay" role="dialog" aria-modal="true" aria-label="Game over">
    <div class="win-card">
      <div id="win-symbol" class="win-symbol-big" aria-hidden="true"></div>
      <h2 id="win-title" class="win-title"></h2>
      <p class="win-subtitle">3 in a row!</p>
      <button class="btn-new-game" aria-label="Play again">Play Again</button>
    </div>
  </div>

  <!-- Confetti container -->
  <div id="confetti-wrap" class="confetti-wrap" aria-hidden="true"></div>

  <!-- Scripts: logic first (sets globals), then UI -->
  <script src="js/game-logic.js"></script>
  <script src="js/ui.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
