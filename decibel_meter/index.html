<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Decibel Meter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Start Screen */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: clamp(300px, 90vw, 500px);
            padding: 40px 20px;
            text-align: center;
        }

        #start-screen h1 {
            font-size: clamp(1.5rem, 8vw, 2.5rem);
            font-weight: 600;
            color: #fff;
        }

        #start-screen p {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #999;
            line-height: 1.5;
        }

        #start-btn {
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: clamp(100px, 25vw, 160px);
            height: clamp(100px, 25vw, 160px);
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:hover {
            background: #43A047;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #error-msg {
            color: #ef5350;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            line-height: 1.5;
            display: none;
        }

        /* Meter Screen - Natural Flex Flow */
        #meter-screen {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            box-sizing: border-box;
            padding: clamp(10px, 3vh, 30px);
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        #meter-screen h1 {
            font-size: clamp(0.6rem, 2vw, 0.9rem);
            font-weight: 400;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            z-index: 10;
        }

        /* Top Section: Title and Encouragement */
        /* Top Section */
        .top-section {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 2vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }

        /* Middle Section: Mascot (Left) and Signals (Right) */
        .middle-section {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
            gap: 15px;
            margin-bottom: 2vh;
        }

        /* Central Mascot Area - Flex child */
        .mascot-container {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
            pointer-events: none;
        }

        .mascot-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        .mascot-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: none;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        .mascot-box.calm .img-calm { display: block; }
        .mascot-box.happy .img-happy { display: block; }
        .mascot-box.excited .img-excited { display: block; }

        /* Right Side Signals (Meter only) */
        .right-signals {
            width: 70px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* dB Readout */
        #db-readout {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.8rem, 2.5vw, 1.2rem);
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        #db-unit {
            display: none;
        }

        /* Encouragement Text */
        #encouragement-text {
            position: relative;
            text-align: center;
            font-size: clamp(1.4rem, 5vw, 3rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            z-index: 15;
            pointer-events: none;
            font-style: italic;
            letter-spacing: -1px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bride Mascot CSS Puppet (BACKUP)
        .bride {
            position: relative;
            width: 100px;
            height: 130px;
        }
        .bride-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 60px;
            background: #d32f2f;
            border-radius: 40px 40px 10px 10px;
            border-top: 4px solid #ffd700;
            border: 2px solid #000;
        }
        .bride-head {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 80px;
            background: #ffdbac;
            border-radius: 35px 35px 30px 30px;
            z-index: 2;
            border: 2px solid #000;
        }
        .bride-veil {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 100px;
            background: #b71c1c;
            border-radius: 40px 40px 20px 20px;
            z-index: 1;
            border: 2px solid #ffd700;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .bindi {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 2px #ffd700;
        }
        .nath {
            position: absolute;
            top: 48px;
            left: 38px;
            width: 12px;
            height: 12px;
            border: 1.5px solid #ffd700;
            border-radius: 50%;
        }
        .eye {
            position: absolute;
            top: 35px;
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .eye.left { left: 15px; }
        .eye.right { right: 15px; }
        .eye-heart {
            display: none;
            font-size: 1.2rem;
            position: absolute;
        }
        .mouth {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 8px;
            border-bottom: 3px solid #c2185b;
            border-radius: 0 0 10px 10px;
            transition: all 0.2s;
        }
        */

        /* SVG Mascot Styles */
        .mascot-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        .mascot-img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }

        .mascot-box.calm .img-calm { display: block; }
        .mascot-box.happy .img-happy { display: block; }
        .mascot-box.excited .img-excited { display: block; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .mascot-box.excited {
            animation: shake 0.5s infinite;
        }

        /* Mascot States - (BACKUP)
        .mascot-box.calm .eye { transform: scale(1); }
        .mascot-box.happy .mouth { height: 12px; width: 25px; border-radius: 5px 5px 15px 15px; background: #c2185b; }
        .mascot-box.happy .eye { transform: scale(1.8); }
        .mascot-box.excited .mouth { height: 20px; width: 30px; border-radius: 5px 5px 20px 20px; background: #880e4f; }
        .mascot-box.excited .eye { background: none; }
        .mascot-box.excited .eye-heart { display: block; }
        */

        /* Meter Bar Adjustments */
        .meter-wrapper {
            display: flex;
            align-items: stretch;
            gap: 8px;
            flex: 1;
            max-height: 40vh;
            width: 60px;
        }

        .meter-ticks {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 0;
            width: 20px;
            text-align: right;
        }

        .meter-ticks span {
            font-size: clamp(0.5rem, 1.5vw, 0.7rem);
            color: #333;
            font-family: 'Courier New', monospace;
            font-weight: 700;
        }

        .meter-bar-container {
            flex: 1;
            background: #050510;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid #1a1a2e;
        }

        .meter-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            transition: height 0.08s linear;
            border-radius: 0 0 7px 7px;
        }

        /* Peak indicator line */
        .meter-peak {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
            transition: bottom 0.08s linear;
            bottom: 0;
            opacity: 0.6;
            box-shadow: 0 0 10px #fff;
        }

        /* Threshold lines */
        .meter-bar-container::before,
        .meter-bar-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 1;
        }

        /* 80 dB line (yellow threshold) = 55.6% from bottom ( (80-30)/(120-30) = 5/9 ≈ 55.6% ) */
        .meter-bar-container::before {
            bottom: 55.6%;
        }

        /* 100 dB line (red threshold) = 77.8% from bottom ( (100-30)/(120-30) = 7/9 ≈ 77.8% ) */
        .meter-bar-container::after {
            bottom: 77.8%;
        }

        /* Bottom Controls Row - Natural Flow */
        .bottom-controls {
            flex-shrink: 0;
            height: auto;
            min-height: clamp(60px, 8vh, 90px);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 30;
            gap: 15px;
            box-sizing: border-box;
        }

        .calibration-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cal-btn-group {
            display: flex;
            gap: 8px;
        }

        .cal-btn {
            background: #111;
            color: #fff;
            border: 1px solid #222;
            border-radius: 8px;
            width: clamp(32px, 8vw, 54px);
            height: clamp(32px, 8vw, 54px);
            font-size: clamp(1rem, 4vw, 1.8rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cal-value {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.7rem, 2vw, 1.1rem);
            color: #fff;
            min-width: clamp(40px, 10vw, 70px);
            text-align: center;
        }

        #reset-btn {
            background: none;
            color: #444;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            cursor: pointer;
        }

        #stop-btn {
            background: #b71c1c;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: clamp(8px, 2vh, 15px) clamp(12px, 4vw, 30px);
            font-size: clamp(0.7rem, 2.5vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            #reset-btn { display: none; }
        }

        .note {
            font-size: 0.7rem;
            color: #555;
            max-width: 280px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Decibel Meter</h1>
        <p>Measure ambient sound levels using your device's microphone.</p>
        <button id="start-btn" onclick="requestMicrophone()">Start</button>
        <p id="error-msg"></p>
    </div>

    <!-- Meter Screen -->
    <div id="meter-screen">
            <div class="top-section">
                <h1>Decibel Meter</h1>
                <div id="encouragement-text">Too quiet...</div>
            </div>

            <div class="middle-section">
                <!-- Mascot Centered -->
                <div class="mascot-container">
                    <div id="mascot-box" class="mascot-box calm">
                        <img src="svg/calm.svg" class="mascot-img img-calm" alt="Calm Mascot">
                        <img src="svg/happy.svg" class="mascot-img img-happy" alt="Happy Mascot">
                        <img src="svg/excited.svg" class="mascot-img img-excited" alt="Excited Mascot">
                    </div>
                </div>

                <!-- Readout and Meter on the Right -->
                <div class="right-signals">
                    <div id="db-readout">
                        <span id="db-value">--.-</span>
                        <span id="db-unit">dB</span>
                    </div>

                    <div class="meter-wrapper">
                        <div class="meter-ticks">
                            <span>120</span>
                            <span>90</span>
                            <span>60</span>
                            <span>30</span>
                            <span>0</span>
                        </div>
                        <div class="meter-bar-container">
                            <div class="meter-fill" id="meter-fill"></div>
                            <div class="meter-peak" id="meter-peak"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- New Bottom Controls Row -->
            <div class="bottom-controls">
                <div class="calibration-row">
                    <div class="cal-btn-group">
                        <button class="cal-btn" onmousedown="startAdjusting(-1)" onmouseup="stopAdjusting()" onmouseleave="stopAdjusting()" ontouchstart="startAdjusting(-1)" ontouchend="stopAdjusting()">−</button>
                        <button class="cal-btn" onmousedown="startAdjusting(+1)" onmouseup="stopAdjusting()" onmouseleave="stopAdjusting()" ontouchstart="startAdjusting(+1)" ontouchend="stopAdjusting()">+</button>
                    </div>
                    <span id="cal-value">+0 dB</span>
                    <button id="reset-btn" onclick="resetCalibration()">Reset</button>
                </div>

                <button id="stop-btn" onclick="stopMeter()">Stop</button>
            </div>
        </div>
    </div>

    <script>
        // State
        var audioContext = null;
        var analyser = null;
        var dataArray = null;
        var mediaStream = null;
        var animationId = null;
        var smoothedDB = -90;
        var peakDB = 0;
        var peakDecayTimer = 0;
        var calibrationOffset = 90;
        var adjustInterval = null;
        var welcomeLocked = false;

        const DB_MIN = 0; // SPL
        const DB_MAX = 120; // SPL
        const SMOOTHING = 0.3;
        const PEAK_HOLD_FRAMES = 60;
        const PEAK_DECAY_RATE = 0.5;
        const CALIBRATION_DEFAULT = 90;

        // DOM elements
        const startScreen = document.getElementById('start-screen');
        const meterScreen = document.getElementById('meter-screen');
        const errorMsg = document.getElementById('error-msg');
        const dbValue = document.getElementById('db-value');
        const meterFill = document.getElementById('meter-fill');
        const meterPeak = document.getElementById('meter-peak');
        const calValue = document.getElementById('cal-value');
        const mascotBox = document.getElementById('mascot-box');
        const encouragement = document.getElementById('encouragement-text');

        // Load calibration on init
        loadCalibration();

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        async function requestMicrophone() {
            // Check support
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError('Your browser does not support microphone access. Please use a modern browser.');
                return;
            }

            // Check secure context
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                showError('Microphone access requires HTTPS or localhost. Please serve this page over a secure connection.');
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        autoGainControl: false,
                        noiseSuppression: false,
                        echoCancellation: false
                    }
                });

                // Create audio context (handle iOS Safari)
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // Setup analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                dataArray = new Float32Array(analyser.fftSize);

                // Connect mic to analyser
                const source = audioContext.createMediaStreamSource(mediaStream);
                source.connect(analyser);

                // Switch screens
                startScreen.style.display = 'none';
                meterScreen.style.display = 'flex';

                // Start meter loop
                smoothedDB = DB_MIN;
                peakDB = DB_MIN;
                updateMeter();
            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showError('Microphone access was denied. Please allow microphone access in your browser settings and reload the page.');
                } else if (err.name === 'NotFoundError') {
                    showError('No microphone found. Please connect a microphone and try again.');
                } else {
                    showError('Could not access microphone: ' + err.message);
                }
            }
        }

        function computeRMS(buffer) {
            let sum = 0;
            for (let i = 0; i < buffer.length; i++) {
                sum += buffer[i] * buffer[i];
            }
            return Math.sqrt(sum / buffer.length);
        }

        function rmsToDb(rms) {
            if (rms < 1e-10) return -90; // dBFS min
            const db = 20 * Math.log10(rms);
            return Math.max(-90, Math.min(0, db));
        }

        function dbToPercent(db) {
            return ((db - DB_MIN) / (DB_MAX - DB_MIN)) * 100;
        }

        function getBarColor(percent) {
            // Green → Yellow → Red
            if (percent < 55) {
                // Green zone
                return '#4CAF50';
            } else if (percent < 78) {
                // Yellow zone
                return '#FFC107';
            } else {
                // Red zone
                return '#f44336';
            }
        }

        function getBarGradient(percent) {
            if (percent < 55) {
                return 'linear-gradient(to top, #2E7D32, #4CAF50)';
            } else if (percent < 78) {
                return 'linear-gradient(to top, #2E7D32, #4CAF50 60%, #FFC107)';
            } else {
                return 'linear-gradient(to top, #2E7D32, #4CAF50 40%, #FFC107 70%, #f44336)';
            }
        }

        function updateDisplay(dbFS) {
            const calibratedDB = dbFS + calibrationOffset;
            const clampedDB = Math.max(DB_MIN, Math.min(DB_MAX, calibratedDB));
            const percent = dbToPercent(clampedDB);

            // Update bar
            meterFill.style.height = percent + '%';
            meterFill.style.background = getBarGradient(percent);

            // Update peak
            if (clampedDB > peakDB) {
                peakDB = clampedDB;
                peakDecayTimer = PEAK_HOLD_FRAMES;
            } else {
                peakDecayTimer--;
                if (peakDecayTimer <= 0) {
                    peakDB -= PEAK_DECAY_RATE;
                    if (peakDB < DB_MIN) peakDB = DB_MIN;
                }
            }

            // Update numeric readout to follow peak
            dbValue.textContent = peakDB.toFixed(1);

            const peakPercent = dbToPercent(peakDB);
            meterPeak.style.bottom = peakPercent + '%';
            meterPeak.style.opacity = peakPercent > 0.5 ? '0.8' : '0';

            // Update Mascot State and Encouragement Text based on peakDB
            if (mascotBox && !welcomeLocked) {
                mascotBox.classList.remove('calm', 'happy', 'excited');
                
                if (peakDB < 40) {
                    encouragement.textContent = "Too quiet...";
                    encouragement.style.color = "#555";
                    encouragement.style.transform = "scale(0.8)";
                    mascotBox.classList.add('calm');
                } else if (peakDB < 65) {
                    encouragement.textContent = "Keep going!";
                    encouragement.style.color = "#4CAF50";
                    encouragement.style.transform = "scale(1)";
                    mascotBox.classList.add('calm');
                } else if (peakDB < 85) {
                    encouragement.textContent = "That's it!";
                    encouragement.style.color = "#FFC107";
                    encouragement.style.transform = "scale(1.1)";
                    mascotBox.classList.add('happy');
                } else if (peakDB < 100) {
                    encouragement.textContent = "LOUDER!!";
                    encouragement.style.color = "#FF9800";
                    encouragement.style.transform = "scale(1.3)";
                    mascotBox.classList.add('happy');
                } else if (peakDB < 115) {
                    encouragement.textContent = "SHOUT IT OUT!";
                    encouragement.style.color = "#f44336";
                    encouragement.style.transform = "scale(1.5)";
                    mascotBox.classList.add('excited');
                } else {
                    encouragement.textContent = "WELCOME!";
                    encouragement.style.color = "#fff";
                    encouragement.style.transform = "scale(1.8)";
                    mascotBox.classList.add('excited');
                    welcomeLocked = true;
                }
            }
        }

        function updateMeter() {
            analyser.getFloatTimeDomainData(dataArray);
            const rms = computeRMS(dataArray);
            const dbFS = rmsToDb(rms);

            // Exponential smoothing
            smoothedDB = SMOOTHING * dbFS + (1 - SMOOTHING) * smoothedDB;

            updateDisplay(smoothedDB);

            animationId = requestAnimationFrame(updateMeter);
        }

        function stopMeter() {
            // Stop animation
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            // Reset state
            welcomeLocked = false;

            // Stop mic stream
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            // Close audio context
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            // Switch screens
            meterScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            errorMsg.style.display = 'none';
        }

        // Calibration
        function loadCalibration() {
            const stored = localStorage.getItem('db-meter-calibration-spl');
            if (stored !== null) {
                calibrationOffset = parseFloat(stored);
            } else {
                // Try legacy key if exists
                const legacy = localStorage.getItem('db-meter-calibration');
                if (legacy !== null) {
                    calibrationOffset = parseFloat(legacy) + 90; // Rough conversion
                    localStorage.removeItem('db-meter-calibration');
                }
            }
            updateCalibrationDisplay();
        }

        function startAdjusting(delta) {
            adjustCalibration(delta);
            // Initial delay before repeating
            adjustInterval = setTimeout(() => {
                adjustInterval = setInterval(() => {
                    adjustCalibration(delta);
                }, 100); // 100ms for 1dB steps feels natural
            }, 500);
        }

        function stopAdjusting() {
            if (adjustInterval) {
                clearTimeout(adjustInterval);
                clearInterval(adjustInterval);
                adjustInterval = null;
            }
        }

        function adjustCalibration(delta) {
            calibrationOffset += delta;
            // Clamp to reasonable range for SPL offset
            calibrationOffset = Math.max(0, Math.min(200, calibrationOffset));
            localStorage.setItem('db-meter-calibration-spl', calibrationOffset.toString());
            updateCalibrationDisplay();
        }

        function resetCalibration() {
            calibrationOffset = CALIBRATION_DEFAULT;
            localStorage.setItem('db-meter-calibration-spl', CALIBRATION_DEFAULT.toString());
            updateCalibrationDisplay();
        }

        function updateCalibrationDisplay() {
            const displayOffset = Math.round(calibrationOffset - CALIBRATION_DEFAULT);
            const sign = displayOffset >= 0 ? '+' : '';
            calValue.textContent = sign + displayOffset + ' dB';
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
